# Local infra + the three app processes. `docker compose up redis` is enough if you run apps with npm.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]

  api:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    command: ["node", "--import", "tsx", "apps/worker/src/api.ts"]
    env_file: .env
    environment: { REDIS_URL: "redis://redis:6379", LOCAL_DATA_DIR: /data }
    ports: ["4100:4100"]
    depends_on: [redis]
    volumes: [local-data:/data]

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    command: ["node", "--import", "tsx", "apps/worker/src/worker.ts"]
    env_file: .env
    environment: { REDIS_URL: "redis://redis:6379", LOCAL_DATA_DIR: /data }
    depends_on: [redis]
    shm_size: "1gb"            # Chromium needs more than the 64MB default /dev/shm
    volumes: [local-data:/data]

  web:
    build: { context: ., dockerfile: apps/web-admin/Dockerfile }
    environment: { NEXT_PUBLIC_API_URL: "http://localhost:4100/api" }
    ports: ["3100:3100"]

volumes:
  redis-data:
  local-data:
