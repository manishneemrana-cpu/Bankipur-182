# All-in-one stack for ONE VPS: Caddy (HTTPS + password) -> web UI + API, plus render worker and Redis.
# Normally started by setup.sh. Manual:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: "${API_DOMAIN:?set API_DOMAIN in .env}"
      BASIC_USER: "${BASIC_USER:?set BASIC_USER in .env}"
      BASIC_HASH: "${BASIC_HASH:?set BASIC_HASH in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, web]

  web:
    build:
      context: ..
      dockerfile: apps/web-admin/Dockerfile
      args: { NEXT_PUBLIC_API_URL: "/api" }   # same-origin: Caddy routes /api and /files to the API
    restart: unless-stopped
    expose: ["3100"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]               # not published: only reachable inside this compose network

  api:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    command: ["node", "--import", "tsx", "apps/worker/src/api.ts"]
    env_file: .env
    environment:
      REDIS_URL: "redis://redis:6379"
      LOCAL_DATA_DIR: /data
      PORT: "4100"
      PUBLIC_API_URL: "https://${API_DOMAIN}"
      WEB_ORIGIN: "https://${API_DOMAIN}"
    expose: ["4100"]
    depends_on: [redis]
    volumes: [local-data:/data]

  worker:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    command: ["node", "--import", "tsx", "apps/worker/src/worker.ts"]
    env_file: .env
    # PUBLIC_API_URL must match the API's: the worker maps URLs under it back to files on disk instead of fetching them over HTTP.
    environment: { REDIS_URL: "redis://redis:6379", LOCAL_DATA_DIR: /data, PUBLIC_API_URL: "https://${API_DOMAIN}" }
    shm_size: "1gb"                           # Chromium needs more than the 64MB default /dev/shm
    depends_on: [redis]
    volumes: [local-data:/data]

volumes: { redis-data: {}, local-data: {}, caddy-data: {}, caddy-config: {} }
